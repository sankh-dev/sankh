name: Site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - install.sh
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - docs/**
      - install.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Publish install.sh at https://sankh.dev/install.sh
        run: |
          sh -n install.sh
          cp install.sh site/build/install.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
