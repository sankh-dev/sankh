# Builds the desktop app installers and attaches them to the GitHub Release
# that cargo-dist (release.yml) created for the same tag. Running after that
# workflow, rather than on the tag push, means the release already exists.
#
# The installers are not code signed or notarized yet.

name: Desktop release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach installers to (e.g. v0.2.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web UI
        run: cd frontend && npm ci && npm run build
      - name: Install webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build installers
        working-directory: crates/sankh-desktop
        run: npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }}
      - name: Collect installers
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          shopt -s nullglob
          for f in "$bundle"/dmg/*.dmg "$bundle"/msi/*.msi "$bundle"/nsis/*.exe \
                   "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage; do
            cp "$f" out/
          done
          cd out
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" out/* --clobber

  # Publishes the macOS app as a cask in the same tap as the CLI formula:
  # brew install --cask sankh-dev/tap/sankh-desktop
  publish-cask:
    needs: build
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    steps:
      - name: Skip prereleases
        id: release
        run: |
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.release.outputs.prerelease == 'false'
        with:
          ref: ${{ env.TAG }}
          path: src
      - uses: actions/checkout@v7
        if: steps.release.outputs.prerelease == 'false'
        with:
          repository: sankh-dev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
          path: tap
      - name: Render cask
        if: steps.release.outputs.prerelease == 'false'
        run: |
          version="${TAG#v}"
          mkdir -p sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir sums \
            --pattern "Sankh_${version}_aarch64.dmg.sha256" \
            --pattern "Sankh_${version}_x64.dmg.sha256"
          arm=$(cut -d' ' -f1 "sums/Sankh_${version}_aarch64.dmg.sha256")
          intel=$(cut -d' ' -f1 "sums/Sankh_${version}_x64.dmg.sha256")
          for sum in "$arm" "$intel"; do
            [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "bad checksum: $sum"; exit 1; }
          done
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${version}/" \
              -e "s/__SHA256_ARM__/${arm}/" \
              -e "s/__SHA256_INTEL__/${intel}/" \
              src/.github/homebrew/sankh-desktop.rb.tmpl > tap/Casks/sankh-desktop.rb
          cat tap/Casks/sankh-desktop.rb
      - name: Audit cask
        if: steps.release.outputs.prerelease == 'false'
        run: |
          taps="$(brew --repository)/Library/Taps/sankh-dev"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$PWD/tap" "$taps/homebrew-tap"
          brew style --cask sankh-dev/tap/sankh-desktop
          brew audit --cask --online sankh-dev/tap/sankh-desktop
      - name: Push cask
        if: steps.release.outputs.prerelease == 'false'
        working-directory: tap
        run: |
          git config user.name "sankh release bot"
          git config user.email "release-bot@sankh.dev"
          git add Casks/sankh-desktop.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git commit -m "sankh-desktop ${TAG#v}"
          git push
