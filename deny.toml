[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error (unmaintained) is a build-time macro dependency of
    # gtk-rs 0.18, which Tauri 2 uses on Linux. Desktop app only.
    { id = "RUSTSEC-2024-0370", reason = "build-time dep of gtk-rs 0.18 via Tauri 2" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
